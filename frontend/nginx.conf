# Frontend serving tier (production-grade behind the cluster ingress).
#
# TLS + HSTS terminate at the INGRESS (k8s/Helm + cert-manager) — this container
# intentionally serves plain HTTP behind it; do NOT bake certs here. For the
# docker-compose production-local variant, front this with a TLS-terminating proxy
# (optional). HSTS belongs on the ingress (e.g. nginx-ingress
# `nginx.ingress.kubernetes.io/configuration-snippet` adding Strict-Transport-Security),
# never here.

# WebSocket upgrade map (http context — conf.d/*.conf is included inside http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    client_max_body_size 500M;   # floor-plan uploads

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── Security headers ──────────────────────────────────────────────────────
    # `add_header` does NOT inherit into locations that declare their own, so the
    # safe headers are re-stated in /assets/ and / below. CSP is left commented:
    # ship it only after verifying NO console violations against the running app
    # (Analytics/Konva/recharts, Live Monitoring, floor-plan images) — a wrong CSP
    # white-screens the SPA. Tuned baseline ready to enable:
    #   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Hash-named build assets — safe to cache immutably ─────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── React SPA — index.html must NOT be cached (so new deploys are seen) ────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── API proxy → EEP (unchanged: MJPEG needs buffering off; 500M uploads) ───
    location /api/ {
        proxy_pass http://eep:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;           # MJPEG / chunked streaming
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── Live-bridge websocket proxy (DevE2E live feed) ────────────────────────
    # Without this the live websocket cannot connect from the served image.
    location /ws/ {
        proxy_pass http://live_bridge:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
