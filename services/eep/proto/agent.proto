syntax = "proto3";

package retailvision.agent.v1;

// ── Service ───────────────────────────────────────────────────────────────────

service AgentService {
  // Persistent bidirectional stream. Edge agent dials out to EEP and keeps
  // this stream open for its lifetime. EEP pushes ControlMessages down;
  // the agent sends AgentMessages up.
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
}

// ── Edge → Cloud ──────────────────────────────────────────────────────────────

message AgentMessage {
  oneof payload {
    Heartbeat           heartbeat     = 1;
    CameraStatusReport  camera_status = 2;
  }
}

message Heartbeat {
  string store_id       = 1;
  string agent_version  = 2;
  int64  timestamp_ms   = 3;
}

message CameraStatusReport {
  string camera_id         = 1;
  // "running" | "stopped" | "error"
  string container_status  = 2;
  int64  timestamp_ms      = 3;
}

// ── Cloud → Edge ──────────────────────────────────────────────────────────────

message ControlMessage {
  oneof payload {
    StartCamera start_camera = 1;
    StopCamera  stop_camera  = 2;
  }
}

message StartCamera {
  string   camera_id      = 1;
  string   store_id       = 2;
  string   rtsp_url       = 3;
  float    target_fps     = 4;
  float    window_seconds = 5;
  S3Config s3_config      = 6;
  string   redis_url      = 7;
}

message StopCamera {
  string camera_id = 1;
  string store_id  = 2;
}

message S3Config {
  string endpoint_url = 1;
  string access_key   = 2;
  string secret_key   = 3;
  string bucket       = 4;
}
