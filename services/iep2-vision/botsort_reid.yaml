# Ultralytics BoT-SORT tracker config with ReID enabled.
# Based on Ultralytics tracker YAML shape; tracker_type must remain botsort.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True

# Camera motion compensation. Sparse optical flow is the default BoT-SORT choice.
gmc_method: sparseOptFlow

# BoT-SORT-ReID association gates.
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True

# Dedicated classifier model for appearance embeddings inside BoT-SORT.
# The IEP2 global gallery still computes its own embeddings across cameras.
model: yolo11x-cls.pt
