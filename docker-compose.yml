# Shared configuration injected into all pipeline services via YAML anchor.
# WINDOW_SECONDS and DATABASE_URL_SERVER must be identical across IEP1/IEP2/IEP3 —
# mismatch causes silent reconciliation failure.
x-shared-config: &shared-config
  WINDOW_SECONDS: "${WINDOW_SECONDS:-60}"
  DATABASE_URL_SERVER: "postgresql://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@pgbouncer:5432/${POSTGRES_DB:-retailvision}"
  REDIS_URL: "redis://redis:6379/0"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailvision_dev}
      POSTGRES_DB: ${POSTGRES_DB:-retailvision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # schema.sql used for fast dev resets only; Alembic is the authoritative
      # migration path (R1). Remove this line in staging/production.
      - ./services/eep/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pin to a specific release — minio does not use semver, update periodically.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-retailvision}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retailvision_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  pgbouncer:
    image: pgbouncer/pgbouncer:1.22.1
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "5433:5432"   # Host port 5433 avoids clash with postgres on 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 5432 -U retailvision -d retailvision -c 'SELECT 1' -t 2>/dev/null | grep -q 1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-retailvision_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  # ─── Services ─────────────────────────────────────────────────────────────────

  eep:
    build:
      context: ./services/eep
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      <<: *shared-config
      # EEP uses SQLAlchemy asyncpg dialect — must NOT be DATABASE_URL_SERVER.
      DATABASE_URL_EEP: "postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@pgbouncer:5432/${POSTGRES_DB:-retailvision}"
      # Alembic uses psycopg2 and connects directly to postgres (bypasses PgBouncer).
      ALEMBIC_DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # DEBUG_MODE defaults to false. Override in docker-compose.dev.yml for local dev.
      DEBUG_MODE: ${DEBUG_MODE:-false}
      IEP2_IMAGE: ${IEP2_IMAGE:-retailvision-iep2:latest}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-retail-edge_default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  iep1_ingestion:
    build:
      context: ./services/iep1_ingestion
      dockerfile: Dockerfile
    environment:
      <<: *shared-config
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
    command: >
      python -m services.iep1_ingestion.app.main
      --store-id ${STORE_ID}
      --camera-id ${CAMERA_ID}
      --rtsp ${RTSP_URL}
      --fps ${TARGET_FPS:-5.0}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  iep2_vision:
    build:
      context: ./services/iep2_vision
      dockerfile: Dockerfile
    environment:
      <<: *shared-config
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      LIVE_STREAM_ENABLED: "true"
    volumes:
      - ./testing-data:/workspace/testing-data:ro
    command: >
      python services/iep2_vision/main.py
      --store-id ${STORE_ID}
      --camera-id ${CAMERA_ID}
      --source redis
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  iep3_reconciliation:
    build:
      context: ./services/iep3_reconciliation
      dockerfile: Dockerfile
    environment:
      <<: *shared-config
      STORE_ID: ${STORE_ID:-00000000-0000-0000-0000-000000000001}
      EXPECTED_CAMERAS: ${EXPECTED_CAMERAS:-}
      COORDINATOR_TIMEOUT_S: ${COORDINATOR_TIMEOUT_S:-120}
      REID_THRESHOLD: ${REID_THRESHOLD:-0.75}
      MAX_SPEED_MPS: ${MAX_SPEED_MPS:-1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      SELECTION_WEIGHT_AREA: ${SELECTION_WEIGHT_AREA:-0.7}
      SELECTION_WEIGHT_CONFIDENCE: ${SELECTION_WEIGHT_CONFIDENCE:-0.3}
      GRACE_SECONDS: ${GRACE_SECONDS:-300.0}
      DEFAULT_FRAME_WIDTH: ${DEFAULT_FRAME_WIDTH:-1920}
      DEFAULT_FRAME_HEIGHT: ${DEFAULT_FRAME_HEIGHT:-1080}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  iep4_alerts:
    build:
      context: ./services/iep4_alerts
      dockerfile: Dockerfile
    ports:
      - "8004:8004"

  iep5_analytics:
    build:
      context: ./services/iep5_analytics
      dockerfile: Dockerfile
    ports:
      - "8005:8005"

  iep6_agent:
    build:
      context: ./services/iep6_agent
      dockerfile: Dockerfile
    ports:
      - "8006:8006"

  live_bridge:
    build:
      context: ./services/live_bridge
    ports:
      - "8010:8010"
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      PRESIGNED_URL_EXPIRY: 30
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  # ─── IEP2 Vision Debug Console (dev-only) ────────────────────────────────
  # Runs the FastAPI upload+WebSocket server on :8002.
  # The frontend /dev/vision page connects to VITE_IEP2_DEV_API_URL (default http://localhost:8002).
  # Start alongside the main stack:  docker compose --profile dev up -d iep2_dev
  iep2_dev:
    build:
      context: ./services/iep2_vision
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: *shared-config
    volumes:
      - ./testing-data:/workspace/testing-data:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
    profiles:
      - dev

  # ─── Edge Agent (dev-only) ────────────────────────────────────────────────
  # In production the Edge Agent runs on the physical edge device, not here.
  # This entry lets you test the full gRPC loop on a single machine.
  edge_agent_dev:
    build:
      context: ./services/edge_agent
      dockerfile: Dockerfile
    environment:
      <<: *shared-config
      EEP_GRPC_URL: eep:50051
      STORE_ID: ${STORE_ID:-00000000-0000-0000-0000-000000000001}
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      IEP1_IMAGE: ${IEP1_IMAGE:-retailvision-iep1:latest}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-retail-edge_default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - eep
    profiles:
      - edge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
