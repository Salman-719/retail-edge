services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailvision_dev}
      POSTGRES_DB: ${POSTGRES_DB:-retailvision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/eep/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-retailvision}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retailvision_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-retailvision_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  # ─── Services ─────────────────────────────────────────────────────────────────

  eep:
    build:
      context: ./services/eep
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEBUG_MODE: ${DEBUG_MODE:-true}
      IEP2_IMAGE: ${IEP2_IMAGE:-retailvision-iep2:latest}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-retail-edge_default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  iep1_ingestion:
    build:
      context: ./services/iep1_ingestion
      dockerfile: Dockerfile
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      REDIS_URL: redis://redis:6379/0
    command: >
      python -m services.iep1_ingestion.app.main
      --store-id ${STORE_ID}
      --camera-id ${CAMERA_ID}
      --rtsp ${RTSP_URL}
      --fps ${TARGET_FPS:-5.0}
      --window ${BATCH_WINDOW_SECONDS:-60.0}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  iep2_vision:
    build:
      context: ./services/iep2_vision
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      LIVE_STREAM_ENABLED: "true"
    volumes:
      - ./testing-data:/workspace/testing-data:ro
    command: >
      python services/iep2_vision/main.py
      --store-id ${STORE_ID}
      --camera-id ${CAMERA_ID}
      --source redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  iep3_reconciliation:
    build:
      context: ./services/iep3_reconciliation
      dockerfile: Dockerfile
    ports:
      - "8003:8003"

  iep4_alerts:
    build:
      context: ./services/iep4_alerts
      dockerfile: Dockerfile
    ports:
      - "8004:8004"

  iep5_analytics:
    build:
      context: ./services/iep5_analytics
      dockerfile: Dockerfile
    ports:
      - "8005:8005"

  iep6_agent:
    build:
      context: ./services/iep6_agent
      dockerfile: Dockerfile
    ports:
      - "8006:8006"

  live_bridge:
    build:
      context: ./services/live_bridge
    ports:
      - "8010:8010"
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      PRESIGNED_URL_EXPIRY: 30
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  # ─── Edge Agent (dev-only) ────────────────────────────────────────────────
  # In production the Edge Agent runs on the physical edge device, not here.
  # This entry lets you test the full gRPC loop on a single machine.
  edge_agent_dev:
    build:
      context: ./services/edge_agent
      dockerfile: Dockerfile
    environment:
      EEP_GRPC_URL: eep:50051
      STORE_ID: ${STORE_ID:-00000000-0000-0000-0000-000000000001}
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      IEP1_IMAGE: ${IEP1_IMAGE:-retailvision-iep1:latest}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-retail-edge_default}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - eep
    profiles:
      - edge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
