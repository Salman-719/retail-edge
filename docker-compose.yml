services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailvision_dev}
      POSTGRES_DB: ${POSTGRES_DB:-retailvision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/eep/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-retailvision}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retailvision_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-retailvision_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  # ─── Services ─────────────────────────────────────────────────────────────────

  eep:
    build:
      context: ./services/eep
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  iep1-ingestion:
    build:
      context: ./services/iep1-ingestion
      dockerfile: Dockerfile
    ports:
      - "8001:8001"

  iep2-vision:
    build:
      context: ./services/iep2-vision
      dockerfile: Dockerfile
    ports:
      - "8002:8002"

  iep3-alerts:
    build:
      context: ./services/iep3-alerts
      dockerfile: Dockerfile
    ports:
      - "8003:8003"

  iep4-analytics:
    build:
      context: ./services/iep4-analytics
      dockerfile: Dockerfile
    ports:
      - "8004:8004"

  iep5-agent:
    build:
      context: ./services/iep5-agent
      dockerfile: Dockerfile
    ports:
      - "8005:8005"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
