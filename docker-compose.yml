services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailvision_dev}
      POSTGRES_DB: ${POSTGRES_DB:-retailvision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/eep/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-retailvision}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retailvision_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-retailvision_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  # ─── Services ─────────────────────────────────────────────────────────────────

  # One-shot: applies the IEP2/IEP3 subsystem schema (Domain 9) idempotently
  # (create_all, checkfirst), so an existing Postgres volume — where schema.sql's
  # initdb already ran and won't re-run — gets the new tables. Reuses the
  # lightweight reconciliation image (it bundles common/).
  migrate:
    build:
      context: .
      dockerfile: services/iep3_reconciliation/Dockerfile
    command: ["python", "-m", "common.db.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  eep:
    build:
      context: ./services/eep
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-retailvision}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-retailvision_dev}
      S3_BUCKET: ${S3_BUCKET:-retailvision}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  iep1_ingestion:
    build:
      context: ./services/iep1_ingestion
      dockerfile: Dockerfile
    ports:
      - "8001:8001"

  # IEP2 vision (rebuilt): per-camera CLI worker. Build context is the repo root
  # so the image includes the shared common/ package. Launched per camera by the
  # M6 orchestrator (no long-running HTTP server / port).
  iep2_vision:
    build:
      context: .
      dockerfile: services/iep2_vision/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./testing-data:/app/testing-data:ro
      - iep2_model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["pipeline"]
    command: ["python", "-c", "import services.iep2_vision.app.main; print('iep2 ready')"]

  # IEP3 cross-camera reconciliation: single-instance coordinator/worker.
  iep3_reconciliation:
    build:
      context: .
      dockerfile: services/iep3_reconciliation/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["pipeline"]
    command: ["python", "-c", "import services.iep3_reconciliation.app.main; print('iep3 ready')"]

  # EEP stand-in: runs the full IEP2->IEP3 chain in one process against demo
  # videos. Invoke as a one-off job (not a long-running server):
  #   docker compose run --rm orchestrator python -m tools.orchestrator \
  #     --store-id 00000000-0000-0000-0000-000000000001 \
  #     --camera cam1=/app/testing-data/Test1/Camera1.mp4 \
  #     --camera cam2=/app/testing-data/Test1/Camera2.mp4
  orchestrator:
    build:
      context: .
      dockerfile: tools/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retailvision}:${POSTGRES_PASSWORD:-retailvision_dev}@postgres:5432/${POSTGRES_DB:-retailvision}
      REDIS_URL: redis://redis:6379/0
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./testing-data:/app/testing-data:ro
      - iep2_model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["pipeline"]

  iep4_alerts:
    build:
      context: ./services/iep4_alerts
      dockerfile: Dockerfile
    ports:
      - "8004:8004"

  iep5_analytics:
    build:
      context: ./services/iep5_analytics
      dockerfile: Dockerfile
    ports:
      - "8005:8005"

  iep6_agent:
    build:
      context: ./services/iep6_agent
      dockerfile: Dockerfile
    ports:
      - "8006:8006"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  iep2_runtime:
  iep2_model_cache:
