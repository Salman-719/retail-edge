[databases]
; Route the retailvision database to the postgres container.
retailvision = host=postgres port=5432 dbname=retailvision

[pgbouncer]
listen_addr = *
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; Session pooling: each asyncpg logical connection holds a dedicated PostgreSQL
; server connection for its lifetime.
;
; WHY NOT transaction mode: asyncpg uses the extended query protocol
; (PARSE → BIND → EXECUTE). PgBouncer transaction mode can reassign the server
; connection between these sub-steps, causing "prepared statement does not exist"
; errors that produce intermittent 500s. This cannot be fixed server-side without
; breaking the PARSE/EXECUTE cycle.
;
; WHY session mode works: asyncpg already manages its own connection pool
; (pool_size + max_overflow in EEP; create_pool in IEP2/IEP3). PgBouncer
; transaction multiplexing adds no benefit here — only instability.
;
; Capacity: EEP max 30 + IEP3 max 10 + IEP2 max 2 + misc ≈ 50 server connections.
; PostgreSQL default max_connections=100 — well within limits.
pool_mode = session
max_client_conn = 200
default_pool_size = 50

; DISCARD ALL cleans session state when asyncpg closes a connection and the
; server connection is returned to PgBouncer's pool for the next client.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Suppress harmless extra_float_digits parameter from asyncpg/psycopg2.
ignore_startup_parameters = extra_float_digits

logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
