[databases]
; Route the retailvision database to the postgres container.
retailvision = host=postgres port=5432 dbname=retailvision

[pgbouncer]
listen_addr = *
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: connection returned to pool after each transaction.
; Services must NOT use SET statements or LISTEN/NOTIFY — connection state is
; not preserved between transactions.
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20

; Must be empty for transaction pooling — session resets break connection reuse.
server_reset_query =
server_reset_query_always = 0

; Suppress harmless extra_float_digits parameter from asyncpg/psycopg2.
ignore_startup_parameters = extra_float_digits

logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
