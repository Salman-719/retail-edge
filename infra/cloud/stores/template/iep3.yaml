# Template — copy to stores/{store_id}/ and replace __STORE_ID__ placeholder.
# Apply with: kubectl apply -k infra/cloud/stores/{store_id}/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep3-__STORE_ID__
  namespace: retail-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep3
      store: __STORE_ID__
  template:
    metadata:
      labels:
        app: iep3
        store: __STORE_ID__
    spec:
      containers:
        - name: iep3
          image: REPLACE_WITH_ECR_OR_REGISTRY/iep3-reconciliation:latest
          command: ["python", "-m", "services.iep3_reconciliation.app.main"]
          env:
            - name: STORE_ID
              value: "__STORE_ID__"
            - name: IEP3_REDIS_STREAM
              value: "stream:store:__STORE_ID__:batch_complete"
            # Optional override. Leave empty in production — IEP3 reads the
            # store's cameras from the DB and auto-refreshes when you change
            # them in the GUI (no restart needed). Set only for testing.
            - name: IEP3_CAMERA_IDS
              value: ""
          envFrom:
            - configMapRef:
                name: retail-edge-config
            - secretRef:
                name: retail-edge-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
