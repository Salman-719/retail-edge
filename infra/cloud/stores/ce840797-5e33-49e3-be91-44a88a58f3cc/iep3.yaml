# Template — copy to stores/{store_id}/ and replace ce840797-5e33-49e3-be91-44a88a58f3cc placeholder.
# Apply with: kubectl apply -k infra/cloud/stores/{store_id}/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep3-ce840797-5e33-49e3-be91-44a88a58f3cc
  namespace: retail-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep3
      store: ce840797-5e33-49e3-be91-44a88a58f3cc
  template:
    metadata:
      labels:
        app: iep3
        store: ce840797-5e33-49e3-be91-44a88a58f3cc
    spec:
      containers:
        - name: iep3
          image: 692461731658.dkr.ecr.eu-west-1.amazonaws.com/iep3-reconciliation:latest
          command: ["python", "-m", "services.iep3_reconciliation.app.main"]
          env:
            - name: STORE_ID
              value: "ce840797-5e33-49e3-be91-44a88a58f3cc"
            - name: IEP3_REDIS_STREAM
              value: "stream:store:ce840797-5e33-49e3-be91-44a88a58f3cc:batch_complete"
            # Optional override. Leave empty in production — IEP3 reads the
            # store's cameras from the DB and auto-refreshes when you change
            # them in the GUI (no restart needed). Set only for testing.
            - name: IEP3_CAMERA_IDS
              value: ""
          envFrom:
            - configMapRef:
                name: retail-edge-config
            - secretRef:
                name: retail-edge-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
