# Template — copy to stores/{store_id}/ and replace 210799b1-8553-48b3-853e-b0c06c3f2f14 placeholder.
# Apply with: kubectl apply -k infra/cloud/stores/{store_id}/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep3-210799b1-8553-48b3-853e-b0c06c3f2f14
  namespace: retail-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep3
      store: 210799b1-8553-48b3-853e-b0c06c3f2f14
  template:
    metadata:
      labels:
        app: iep3
        store: 210799b1-8553-48b3-853e-b0c06c3f2f14
    spec:
      containers:
        - name: iep3
          image: 692461731658.dkr.ecr.eu-west-1.amazonaws.com/iep3-reconciliation:latest
          command: ["python", "-m", "services.iep3_reconciliation.app.main"]
          env:
            - name: STORE_ID
              value: "210799b1-8553-48b3-853e-b0c06c3f2f14"
            - name: IEP3_REDIS_STREAM
              value: "stream:store:210799b1-8553-48b3-853e-b0c06c3f2f14:batch_complete"
            # Comma-separated camera IDs for this store. Empty = pod idles until
            # the store's cameras are configured; set this and restart the pod.
            - name: IEP3_CAMERA_IDS
              value: ""
          envFrom:
            - configMapRef:
                name: retail-edge-config
            - secretRef:
                name: retail-edge-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
