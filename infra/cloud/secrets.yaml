# Fill from CDK outputs and RDS credentials in AWS Secrets Manager
apiVersion: v1
kind: Secret
metadata:
  name: retail-edge-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://retailvision:<PASS>@<RDS_HOST>:5432/retailvision"
  S3_BUCKET: "REPLACE_WITH_CDK_OUTPUT_FramesBucket"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  VISION_INTERNAL_TOKEN: "REPLACE_WITH_STRONG_SECRET"
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET"
