apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-edge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API + internal routes go to EEP (longest-prefix wins over "/")
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eep
                port:
                  number: 8000
          - path: /internal
            pathType: Prefix
            backend:
              service:
                name: eep
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: eep
                port:
                  number: 8000
          # Everything else (the SPA) goes to the frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
