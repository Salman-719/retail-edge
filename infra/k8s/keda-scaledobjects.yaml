apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: iaip2-detector-workers-lag
spec:
  scaleTargetRef:
    name: iaip2-detector-workers
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda.retail-edge.svc.cluster.local:9092
        consumerGroup: iaip2-detector-workers
        topic: vision.frame_ref.v1
        lagThreshold: "100"
