apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep3-reconciliation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep3-reconciliation
  template:
    metadata:
      labels:
        app: iep3-reconciliation
    spec:
      containers:
        - name: iep3-reconciliation
          image: retail-edge/iep3-reconciliation:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - services.iep3_reconciliation.app.main
          args:
            - --store-id
            - "$(STORE_ID)"
            - --cameras
            - "$(IEP3_CAMERA_IDS)"
          envFrom:
            - configMapRef:
                name: retail-edge-config
            - secretRef:
                name: retail-edge-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
