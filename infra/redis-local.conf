# Redis configuration for the edge-local Redis instance (Jetson device).
# Bound to loopback only — never exposed to the network.
# Streams are ephemeral: if the device reboots, IEP1 re-publishes the current
# window and IEP2 re-consumes. No persistence required on edge.

bind 127.0.0.1
port 6379
protected-mode yes

# Disable persistence — local streams are ephemeral
save ""
appendonly no

# Memory cap with LRU eviction — prevents OOM on long-running edge device
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /var/log/redis-local.log
