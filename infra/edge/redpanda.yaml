apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
          command:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=256M
            - --reserve-memory=0M
            - --node-id=0
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda.retail-edge.svc.cluster.local:9092
          ports:
            - containerPort: 9092
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "health"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  clusterIP: None
