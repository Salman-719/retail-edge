apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-edge
  namespace: retailvision
  labels:
    app: redis-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-edge
  template:
    metadata:
      labels:
        app: redis-edge
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis-edge
  namespace: retailvision
spec:
  selector:
    app: redis-edge
  ports:
    - name: redis
      port: 6379
      targetPort: redis
