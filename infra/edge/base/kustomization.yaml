apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply with: kubectl apply -k infra/edge/base/
# `newName` rewrites the placeholder owner (your-org) to the real GHCR owner.
# Change `salman-719` to your own GitHub owner if you fork.
resources:
  - namespace.yaml
  - rbac.yaml
  - iep1-daemon.yaml
  - yolo-service.yaml
  - reid-service.yaml

images:
  - name: ghcr.io/your-org/retailvision/iep1
    newName: ghcr.io/salman-719/retailvision/iep1
    newTag: "1.0.0"
  - name: ghcr.io/your-org/retailvision/yolo
    newName: ghcr.io/salman-719/retailvision/yolo
    newTag: "1.0.0"
  - name: ghcr.io/your-org/retailvision/reid
    newName: ghcr.io/salman-719/retailvision/reid
    newTag: "1.0.0"
