apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = device-agnostic resources. Do NOT apply this directly — apply an overlay
# that selects the device profile + image variants:
#   kubectl apply -k infra/edge/overlays/jetson    # Jetson iGPU (TensorRT)
#   kubectl apply -k infra/edge/overlays/cuda       # discrete NVIDIA GPU (CUDA)
#   kubectl apply -k infra/edge/overlays/cpu        # no GPU (CPU)
# (bootstrap-edge-k3s.sh auto-detects and picks the overlay.)
resources:
  - namespace.yaml
  - rbac.yaml
  - iep1-daemon.yaml
  - yolo-service.yaml
  - reid-service.yaml
