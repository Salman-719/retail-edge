apiVersion: v1
kind: Secret
metadata:
  name: retail-edge-secrets
type: Opaque
stringData:
  # Shared secret between Jetson IEP2 and cloud EEP internal endpoint
  VISION_INTERNAL_TOKEN: "REPLACE_WITH_SAME_VALUE_AS_CLOUD"

  # S3 only needed if IEP1_FRAME_STORAGE=s3 (multi-node deployments)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  S3_BUCKET: ""
