name: retailvision-camera-simulator

services:
  rtsp-server:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:latest}
    restart: unless-stopped
    ports:
      - "${RTSP_PORT:-8554}:8554/tcp"

  publisher:
    image: ${FFMPEG_IMAGE:-jrottenberg/ffmpeg:4.4-alpine}
    restart: unless-stopped
    depends_on:
      - rtsp-server
    environment:
      STREAMS_FILE: /config/streams.csv
      RTSP_SERVER: rtsp-server
      RTSP_PORT: 8554
      PUBLISH_MODE: ${PUBLISH_MODE:-copy}
      OUTPUT_FPS: ${OUTPUT_FPS:-15}
      OUTPUT_WIDTH: ${OUTPUT_WIDTH:-1280}
      FFMPEG_LOGLEVEL: ${FFMPEG_LOGLEVEL:-warning}
      RESTART_DELAY_SECONDS: ${RESTART_DELAY_SECONDS:-2}
      SYNC_START_DELAY_SECONDS: ${SYNC_START_DELAY_SECONDS:-3}
    volumes:
      - ${VIDEO_ROOT:-../testing-data}:/videos:ro
      - ${STREAMS_FILE_HOST:-./streams.csv}:/config/streams.csv:ro
      - ./scripts/publish-streams.sh:/app/publish-streams.sh:ro
      - ./logs:/logs
    entrypoint: ["/bin/sh", "/app/publish-streams.sh"]
