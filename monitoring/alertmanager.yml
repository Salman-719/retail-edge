global:
  resolve_timeout: 5m

route:
  receiver: telegram-retailvision
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram-retailvision
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: telegram-retailvision
    telegram_configs:
      - bot_token: "8693973586:AAGTILKv4Y8xcDf884uqz4Vc4pVJ22bvQx8"
        chat_id: 7946649314
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} *[RetailVision] {{ .Status | toUpper }}*
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Detail:* {{ .Annotations.description }}
          *Since:* {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}
          {{ end }}
        parse_mode: "Markdown"

inhibit_rules:
  - source_matchers:
      - alertname="TargetDown"
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["job"]
