global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── Active services ──────────────────────────────────────────────────────────

  - job_name: "eep"
    static_configs:
      - targets: ["eep:8000"]
    metrics_path: /metrics

  - job_name: "iep1-ingestion"
    static_configs:
      - targets: ["iep1-ingestion:8001"]
    metrics_path: /metrics

  - job_name: "iep2-vision"
    static_configs:
      - targets: ["iep2-vision:8002"]
    metrics_path: /metrics

