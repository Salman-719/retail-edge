apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-retailvision
    receivers:
      - uid: telegram-retailvision
        type: telegram
        settings:
          bottoken: "8693973586:AAGTILKv4Y8xcDf884uqz4Vc4pVJ22bvQx8"
          chatid: "7946649314"
          message: |
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [RetailVision] {{ .Status | toUpper }}
            {{ range .Alerts }}Alert: {{ .Labels.alertname }} ({{ .Labels.severity }})
            {{ .Annotations.summary }}{{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: telegram-retailvision
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: telegram-retailvision
        matchers:
          - severity = critical
        group_wait: 0s
        repeat_interval: 1h
