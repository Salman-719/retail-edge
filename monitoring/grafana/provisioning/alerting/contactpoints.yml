apiVersion: 1

contactPoints:
  - orgId: 1
    name: retailvision-null
    receivers:
      - uid: retailvision-null
        type: webhook
        settings:
          url: http://127.0.0.1:9/
          httpMethod: POST
        disableResolveMessage: true

policies:
  - orgId: 1
    receiver: retailvision-null
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
