{{- if .Values.iep3.staticProvisioning }}
{{- range .Values.iep3.stores }}
---
# Headless service required by StatefulSet for stable pod identity.
apiVersion: v1
kind: Service
metadata:
  name: iep3-{{ . | replace "-" "" | trunc 16 }}
  namespace: retailvision
  labels:
    app: iep3
    store-id: {{ . }}
spec:
  clusterIP: None
  selector:
    app: iep3
    store-id: {{ . }}
  ports:
    - name: placeholder
      port: 9999
      targetPort: 9999
{{- end }}
{{- end }}
