{{- if and .Values.iep6.enabled .Values.iep6.keda.enabled }}
# KEDA ScaledObject — request-driven autoscaling for the IEP6 agent API.
#
# The agent is OpenAI/IO-bound, so concurrent in-flight requests are a better
# scale signal than CPU. Prometheus discovers iep6-agent pods from annotations in
# iep6-deployment.yaml and relabels the pod app label into the `job` label.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: iep6-agent
  namespace: retailvision
  labels:
    app: iep6-agent
spec:
  scaleTargetRef:
    name: iep6-agent
  minReplicaCount: {{ .Values.iep6.keda.minReplicas }}
  maxReplicaCount: {{ .Values.iep6.keda.maxReplicas }}
  pollingInterval: {{ .Values.iep6.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.iep6.keda.cooldownPeriod | default 120 }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.iep6.keda.prometheusServerAddress | quote }}
        metricName: iep6_http_requests_inprogress
        query: sum(http_requests_inprogress{job="iep6-agent"})
        threshold: {{ .Values.iep6.keda.inflightThreshold | quote }}
{{- end }}
