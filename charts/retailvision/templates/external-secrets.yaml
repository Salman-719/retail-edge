apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: retailvision-secrets
  namespace: retailvision
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: retailvision-secrets
    creationPolicy: Owner
  data:
    - secretKey: redis-url
      remoteRef:
        key: {{ .Values.secrets.redisUrl }}
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.secrets.jwtSecret }}
    - secretKey: agent-secret
      remoteRef:
        key: {{ .Values.secrets.agentSecret }}
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.secrets.postgresPassword }}
    - secretKey: redis-password
      remoteRef:
        key: {{ .Values.secrets.redisPassword }}
    - secretKey: s3-access-key
      remoteRef:
        key: {{ .Values.secrets.s3AccessKey }}
    - secretKey: s3-secret-key
      remoteRef:
        key: {{ .Values.secrets.s3SecretKey }}
