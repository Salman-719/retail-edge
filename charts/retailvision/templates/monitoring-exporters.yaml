{{- if .Values.monitoring.enabled }}
{{- if .Values.monitoring.exporters.redis.enabled }}
# ── redis_exporter ───────────────────────────────────────────────────────────
# Redis runs with TLS in-cluster, so dial rediss:// and skip cert verification
# (the internal CA cert is not mounted here). Password from retailvision-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: retailvision
  labels: { app: redis-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-exporter }
  template:
    metadata:
      labels: { app: redis-exporter }
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.monitoring.exporters.redis.image | quote }}
          env:
            - name: REDIS_ADDR
              value: "rediss://redis:6379"
            - name: REDIS_EXPORTER_SKIP_TLS_VERIFICATION
              value: "true"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retailvision-secrets
                  key: redis-password
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: retailvision
  labels: { app: redis-exporter }
spec:
  selector: { app: redis-exporter }
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
{{- end }}
{{- if .Values.monitoring.exporters.postgres.enabled }}
---
# ── postgres_exporter ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: retailvision
  labels: { app: postgres-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-exporter }
  template:
    metadata:
      labels: { app: postgres-exporter }
    spec:
      containers:
        - name: postgres-exporter
          image: {{ .Values.monitoring.exporters.postgres.image | quote }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retailvision-secrets
                  key: postgres-password
            - name: DATA_SOURCE_NAME
              value: "postgresql://{{ .Values.postgres.user }}:$(PG_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: retailvision
  labels: { app: postgres-exporter }
spec:
  selector: { app: postgres-exporter }
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
{{- end }}
{{- if .Values.monitoring.exporters.node.enabled }}
---
# ── node_exporter (DaemonSet) ────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: retailvision
  labels: { app: node-exporter }
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: {{ .Values.monitoring.exporters.node.image | quote }}
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
          ports:
            - containerPort: 9100
              name: metrics
              hostPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
      volumes:
        - name: proc
          hostPath: { path: /proc }
        - name: sys
          hostPath: { path: /sys }
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: retailvision
  labels: { app: node-exporter }
spec:
  selector: { app: node-exporter }
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
{{- end }}
{{- end }}
