{{- if .Values.frontend.enabled }}
# React SPA served by nginx. The image bakes in a compose-oriented nginx.conf
# that proxies /api to host `eep`; in-cluster we override it via ConfigMap so
# /api/ targets the eep-http Service. Public access is via the Ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: retailvision
data:
  default.conf: |
    server {
        listen 80;
        client_max_body_size 500M;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://eep-http:{{ .Values.eep.httpPort }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # MJPEG streaming (tracking/stream endpoint)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: retailvision
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/frontend:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: retailvision
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
