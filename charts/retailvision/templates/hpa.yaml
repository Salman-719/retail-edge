{{- if .Values.eep.hpa.enabled }}
# Horizontal autoscaling for EEP — the stateless control-plane API/gRPC tier.
# IEP3 is NOT autoscaled here: it is one StatefulSet per store (see iep3.stores).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eep
  namespace: retailvision
  labels:
    app: eep
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eep
  minReplicas: {{ .Values.eep.hpa.minReplicas }}
  maxReplicas: {{ .Values.eep.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.eep.hpa.targetCPUUtilizationPercentage }}
{{- end }}
