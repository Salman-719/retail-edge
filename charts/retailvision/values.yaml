global:
  imageRegistry: registry.example.com/retailvision
  imagePullPolicy: IfNotPresent

windowSeconds: "60"

eep:
  image:
    tag: "1.0.0"
  replicas: 2
  grpcPort: 50051
  httpPort: 8000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

iep3:
  image:
    tag: "1.0.0"
  # staticProvisioning: when false (default), EEP provisions IEP3 StatefulSets
  # dynamically via iep3_manager.py on store version activation. Set to true
  # only as an emergency escape hatch (requires iep3.stores to be populated).
  staticProvisioning: false
  stores: []
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

pgbouncer:
  image:
    tag: "1.22.1"
  replicas: 2
  poolMode: transaction
  maxClientConn: 500
  defaultPoolSize: 20

redis:
  image:
    tag: "7.2.4"
  tls: true
  maxmemory: "512mb"

# SPEC-000: TimescaleDB is a hard dependency of the analytics pipeline.
# When the Kubernetes/Postgres migration begins, the Postgres image MUST be
# the TimescaleDB build (drop-in for postgres:16), not stock postgres:16:
#   postgres:
#     image:
#       repository: timescale/timescaledb
#       tag: "2.14.2-pg16"   # pinned; never :latest, never the -ha variant
# The community TimescaleDB Helm chart
# (https://github.com/timescale/timescaledb-kubernetes) is an alternative.
# `CREATE EXTENSION timescaledb CASCADE` is bootstrapped by Alembic 0001, so
# no chart-level extension hook is required once the image is correct.

secrets:
  # Injected by external-secrets from secrets manager.
  # Values are secret manager paths, not plaintext secrets.
  postgresPassword: "retailvision/postgres-password"
  redisPassword:    "retailvision/redis-password"
  jwtSecret:        "retailvision/jwt-secret"
  agentSecret:      "retailvision/agent-secret"
  redisUrl:         "retailvision/redis-url"
