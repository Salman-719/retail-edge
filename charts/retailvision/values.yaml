global:
  # GitHub Container Registry. Replace `your-org` with the GitHub org/user that
  # owns the images (see .github/workflows/build-images.yml). Images are pushed
  # as ghcr.io/<owner>/retailvision/<service>:<tag>.
  imageRegistry: ghcr.io/your-org/retailvision
  imagePullPolicy: IfNotPresent
  # StorageClass for all PVCs (Postgres, Redis). On EKS, Terraform installs the
  # aws-ebs-csi-driver and a default gp3 StorageClass.
  storageClass: gp3

windowSeconds: "60"

# Node placement for the stateful + heavy add-on tier (Postgres/TimescaleDB, Redis,
# Prometheus, Grafana, MLflow). On EKS these are pinned to the on-demand "stable"
# managed node group so Spot/Karpenter reclaim never disrupts data. Empty (default)
# = schedule anywhere (k3s/dev). values.production sets {workload: stable}.
stablePool:
  nodeSelector: {}
  tolerations: []

# Database connection host for EEP/IEP3. Default routes through pgbouncer; set to
# "postgres" (and pgbouncer.enabled=false) to connect directly (lower footprint).
database:
  host: pgbouncer

eep:
  image:
    tag: "1.2.0"
  replicas: 2
  grpcPort: 50051
  httpPort: 8000
  # gRPC exposure. EKS production sets LoadBalancer + AWS NLB annotations from
  # Terraform outputs. ClusterIP is useful for dev or shared-ingress experiments.
  grpc:
    serviceType: ClusterIP
    serviceAnnotations: {}
  canaryPercentage: 0
  # Public hostname edge devices dial for gRPC; must match the cert SAN and the
  # EEP_HOST passed to bootstrap-edge-k3s.sh. Override per environment.
  grpcHost: eep.retailvision.example.com
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  # SMTP for IEP4 alert emails + EEP notifications. Blank host = email disabled.
  # If passwordSecretKey is set, it must be a key in retailvision-secrets.
  smtp:
    host: ""
    port: 587
    user: ""
    from: ""
    passwordSecretKey: ""   # e.g. "smtp-password" (add to external-secrets first)

iep3:
  image:
    tag: "1.2.0"
  matcher:
    voteDistanceThresholdM: "1.0"
    minVoteRate: "0.6"
    minVotes: "10"
    temporalToleranceMs: "150"
    ambiguityMargin: "0.15"
    reidFallbackThreshold: "0.55"
    maxEmbeddings: "10"
  # staticProvisioning: when false (default), EEP provisions IEP3 StatefulSets
  # dynamically via iep3_manager.py on store version activation (RBAC in rbac.yaml).
  # Set true only as an emergency escape hatch (requires iep3.stores populated).
  staticProvisioning: false
  stores: []   # only used when staticProvisioning=true: ["store-uuid-1", ...]
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# IEP4 (alert daemon) and IEP5 (end-of-shift analytics job) are NOT always-on
# Deployments — EEP provisions them per-store on demand (iep4_manager StatefulSet,
# iep5_manager batch Job). Only the image tags live here; the pod specs are built
# by the managers. Tags feed EEP's IEP4_IMAGE/IEP5_IMAGE env (see eep-deployment).
iep4:
  image:
    tag: "1.2.0"
iep5:
  image:
    tag: "1.2.0"

frontend:
  enabled: true
  image:
    tag: "1.2.0"
  replicas: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# IEP6 — AI analytics agent (OpenAI). Needs the openai-api-key secret seeded.
iep6:
  enabled: true
  image:
    tag: "1.2.0"
  replicas: 1
  openaiModel: "gpt-4o-mini"
  enableRawSql: false      # guarded ad-hoc SELECT tool (off by default)
  enableEepActions: false  # state-changing actions via EEP (off = read-only)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# In-cluster PostgreSQL (cheapest option). For managed RDS instead, set
# postgres.enabled=false and point pgbouncer POSTGRESQL_HOST at the RDS endpoint.
# SPEC-000: TimescaleDB is a hard dependency of the analytics pipeline (IEP5 +
# alembic 0010 hypertables). The image is a drop-in for postgres:16 that bundles
# the timescaledb library. Pinned — never :latest, never the -ha variant.
# A fresh data volume is required when switching engines (see DEPLOYMENT_GUIDE).
postgres:
  enabled: true
  image:
    repository: timescale/timescaledb
    tag: "2.14.2-pg16"
  user: retailvision
  database: retailvision
  storage: 20Gi
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

pgbouncer:
  enabled: true
  image:
    tag: "1.22.1"
  replicas: 2
  poolMode: transaction
  maxClientConn: 500
  defaultPoolSize: 20

redis:
  image:
    tag: "7.2.4"
  tls: true
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
  maxmemory: "512mb"      # redis units (feeds redis.conf)
  memoryLimit: "768Mi"    # k8s container memory limit (headroom over maxmemory)

# ── Observability: Prometheus + Grafana + exporters ─────────────────────────
# Scrapes EEP, annotated cloud workers such as IEP3 (:9300), and redis/postgres/
# node exporters. Edge YOLO/ReID/IEP1/IEP2 expose metrics ports but are not
# federated into cloud Prometheus by default.
monitoring:
  enabled: false   # production overlay enables it
  prometheus:
    image: "prom/prometheus:v2.51.0"
    retention: "15d"
    storage: 10Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "1Gi" }
  alertmanager:
    enabled: true
    image: "prom/alertmanager:v0.27.0"
    resources:
      requests: { cpu: "25m", memory: "64Mi" }
      limits:   { cpu: "100m", memory: "128Mi" }
  grafana:
    image: "grafana/grafana:10.4.1"
    host: ""        # e.g. grafana.<INGRESS_EIP>.nip.io ; blank = no ingress (port-forward)
    adminUser: "admin"
    storage: 2Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "300m", memory: "512Mi" }
  exporters:
    redis:    { enabled: true, image: "oliver006/redis_exporter:v1.62.0" }
    postgres: { enabled: true, image: "quay.io/prometheuscommunity/postgres-exporter:v0.15.0" }
    node:     { enabled: true, image: "prom/node-exporter:v1.8.1" }

# ── MLflow tracking + model registry (MLOps) ─────────────────────────────────
# Server image is built from mlops/ (bundles mlflow + boto3). Backend = SQLite on
# a PVC; artifacts = S3 (proxied via --serve-artifacts, so eval clients need no S3
# creds). Image ref = {global.imageRegistry}/mlflow:{tag}.
mlflow:
  enabled: false   # production overlay enables it
  image:
    tag: "1.2.0"
  host: ""          # e.g. mlflow.<INGRESS_EIP>.nip.io ; blank = no ingress (port-forward)
  artifactPrefix: "mlflow"   # S3 key prefix inside s3.bucket
  storage: 5Gi      # PVC for the SQLite backend store
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }

# Public HTTPS ingress for the SPA + API (via the frontend pod's /api proxy).
# Requires ingress-nginx + cert-manager (installed by the EKS Terraform add-ons).
ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-prod
  appHost: app.retailvision.example.com   # override per environment

# Object storage. Empty endpointUrl => boto3 uses real AWS S3 for the region.
s3:
  endpointUrl: ""
  publicUrl: ""                            # e.g. https://cdn.retailvision.example.com
  bucket: retailvision
  region: eu-west-1

# Alembic migrations run as a Helm pre-install/pre-upgrade hook.
migrations:
  enabled: true

secrets:
  # Injected by external-secrets from AWS Secrets Manager.
  # Values are secret-manager paths/names, not plaintext secrets.
  postgresPassword: "retailvision/postgres-password"
  redisPassword:    "retailvision/redis-password"
  jwtSecret:        "retailvision/jwt-secret"
  agentSecret:      "retailvision/agent-secret"
  redisUrl:         "retailvision/redis-url"
  s3AccessKey:      "retailvision/s3-access-key"
  s3SecretKey:      "retailvision/s3-secret-key"
  openaiApiKey:     "retailvision/openai-api-key"
  grafanaAdminPassword: "retailvision/grafana-admin-password"
