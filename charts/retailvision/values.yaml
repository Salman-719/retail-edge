global:
  # GitHub Container Registry. Replace `your-org` with the GitHub org/user that
  # owns the images (see .github/workflows/build-images.yml). Images are pushed
  # as ghcr.io/<owner>/retailvision/<service>:<tag>.
  imageRegistry: ghcr.io/your-org/retailvision
  imagePullPolicy: IfNotPresent
  # StorageClass for all PVCs (Postgres, Redis). Provisioned by the
  # aws-ebs-csi-driver in bootstrap-cloud-k3s.sh.
  storageClass: gp3

windowSeconds: "60"

# Database connection host for EEP/IEP3. Default routes through pgbouncer; set to
# "postgres" (and pgbouncer.enabled=false) to connect directly (lower footprint).
database:
  host: pgbouncer

eep:
  image:
    tag: "1.1.0"
  replicas: 2
  grpcPort: 50051
  httpPort: 8000
  # Public hostname edge devices dial for gRPC; must match the cert SAN and the
  # EEP_HOST passed to bootstrap-edge-k3s.sh. Override per environment.
  grpcHost: eep.retailvision.example.com
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

iep3:
  image:
    tag: "1.1.0"
  stores: []   # populated per environment: ["store-uuid-1", "store-uuid-2"]
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

frontend:
  enabled: true
  image:
    tag: "1.1.0"
  replicas: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# IEP6 — AI analytics agent (OpenAI). Needs the openai-api-key secret seeded.
iep6:
  enabled: true
  image:
    tag: "1.1.0"
  replicas: 1
  openaiModel: "gpt-4o-mini"
  enableRawSql: false      # guarded ad-hoc SELECT tool (off by default)
  enableEepActions: false  # state-changing actions via EEP (off = read-only)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# In-cluster PostgreSQL (cheapest option). For managed RDS instead, set
# postgres.enabled=false and point pgbouncer POSTGRESQL_HOST at the RDS endpoint.
postgres:
  enabled: true
  image:
    tag: "16-alpine"
  user: retailvision
  database: retailvision
  storage: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

pgbouncer:
  enabled: true
  image:
    tag: "1.22.1"
  replicas: 2
  poolMode: transaction
  maxClientConn: 500
  defaultPoolSize: 20

redis:
  image:
    tag: "7.2.4"
  tls: true
  maxmemory: "512mb"      # redis units (feeds redis.conf)
  memoryLimit: "768Mi"    # k8s container memory limit (headroom over maxmemory)

# Public HTTPS ingress for the SPA + API (via the frontend pod's /api proxy).
# Requires ingress-nginx + cert-manager (installed by bootstrap-cloud-k3s.sh).
ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-prod
  appHost: app.retailvision.example.com   # override per environment

# Object storage. Empty endpointUrl => boto3 uses real AWS S3 for the region.
s3:
  endpointUrl: ""
  publicUrl: ""                            # e.g. https://cdn.retailvision.example.com
  bucket: retailvision
  region: eu-west-1

# Alembic migrations run as a Helm pre-install/pre-upgrade hook.
migrations:
  enabled: true

secrets:
  # Injected by external-secrets from AWS Secrets Manager.
  # Values are secret-manager paths/names, not plaintext secrets.
  postgresPassword: "retailvision/postgres-password"
  redisPassword:    "retailvision/redis-password"
  jwtSecret:        "retailvision/jwt-secret"
  agentSecret:      "retailvision/agent-secret"
  redisUrl:         "retailvision/redis-url"
  s3AccessKey:      "retailvision/s3-access-key"
  s3SecretKey:      "retailvision/s3-secret-key"
  openaiApiKey:     "retailvision/openai-api-key"
