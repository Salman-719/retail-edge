# Staging overrides — single-replica EEP, reduced resources, one placeholder store.
# NOTE: eep.replicas=1 here because Redis-backed _running_cameras (R1) must be
# deployed before enabling replicas=2. See M4-S1.

eep:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

iep3:
  stores:
    - "00000000-0000-0000-0000-000000000001"   # staging store placeholder
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

pgbouncer:
  replicas: 1
  defaultPoolSize: 10

redis:
  maxmemory: "256mb"
