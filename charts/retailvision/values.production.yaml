# Production overrides for EKS: HA control plane, stable stateful pool, and HPA
# on stateless APIs. Populate iep3.stores only for static emergency provisioning.
database:
  host: postgres

# Pin the stateful tier to the EKS on-demand stable node group.
stablePool:
  nodeSelector:
    workload: stable
  tolerations:
    - key: stable
      operator: Equal
      value: "true"
      effect: NoSchedule

pgbouncer:
  enabled: false

# EEP runs alembic at startup against the schema.sql-seeded Postgres (same as dev),
# so the separate pre/post-install migrate hook is unnecessary here.
migrations:
  enabled: false

eep:
  replicas: 2
  grpcHost: eep.retailvision.example.com   # set the real gRPC hostname before deploy
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

iep3:
  stores: []   # set at deploy time: --set iep3.stores={uuid1,uuid2,...}

frontend:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

iep6:
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4

postgres:
  storage: 50Gi
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    loadBalancerSourceRanges:
      - 10.20.0.0/16

redis:
  maxmemory: "1gb"
  memoryLimit: "1536Mi"
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    loadBalancerSourceRanges:
      - 10.20.0.0/16

# Set the real public hostname (DNS A/ALIAS -> the ingress NLB) before deploy.
ingress:
  appHost: app.retailvision.example.com

s3:
  bucket: retailvision-prod
  region: eu-west-1

# Observability + MLOps on the stable EKS node pool. Hosts use nip.io against
# the ingress EIP;
# override at deploy time, e.g.:
#   --set monitoring.grafana.host=grafana.<INGRESS_EIP>.nip.io
#   --set mlflow.host=mlflow.<INGRESS_EIP>.nip.io
monitoring:
  enabled: true
  grafana:
    host: ""   # set to grafana.<INGRESS_EIP>.nip.io to expose via ingress

mlflow:
  enabled: true
  host: ""     # set to mlflow.<INGRESS_EIP>.nip.io to expose via ingress
