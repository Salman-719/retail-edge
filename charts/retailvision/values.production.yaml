# Production overrides — full replica count, production-grade resources.
# Populate iep3.stores with actual store UUIDs before deploying.

# Lean single-node profile (fits a 2-vCPU t4g.large): direct-to-Postgres (no
# pgbouncer), single replicas, HPA off. Scale up on a bigger node / more nodes.
database:
  host: postgres

pgbouncer:
  enabled: false

# EEP runs alembic at startup against the schema.sql-seeded Postgres (same as dev),
# so the separate pre/post-install migrate hook is unnecessary here.
migrations:
  enabled: false

eep:
  replicas: 1
  grpcHost: eep.retailvision.example.com   # set the real gRPC hostname before deploy
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 4

iep3:
  stores: []   # set at deploy time: --set iep3.stores={uuid1,uuid2,...}

frontend:
  replicas: 1

postgres:
  storage: 50Gi

redis:
  maxmemory: "1gb"
  memoryLimit: "1536Mi"

# Set the real public hostname (DNS A/ALIAS -> the ingress NLB) before deploy.
ingress:
  appHost: app.retailvision.example.com

s3:
  bucket: retailvision-prod
  region: eu-west-1

# Observability + MLOps on the cloud node. Hosts use nip.io against the EIP;
# override at deploy time, e.g.:
#   --set monitoring.grafana.host=grafana.<EIP>.nip.io
#   --set mlflow.host=mlflow.<EIP>.nip.io
monitoring:
  enabled: true
  grafana:
    host: ""   # set to grafana.<EIP>.nip.io to expose via ingress

mlflow:
  enabled: true
  host: ""     # set to mlflow.<EIP>.nip.io to expose via ingress
