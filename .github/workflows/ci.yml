name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: flake8
        run: |
          flake8 services/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E124,E128,E261,E301,E302,E402,F401,F811,F821,F841

      - name: black (check only)
        continue-on-error: true
        run: black --check --line-length=120 services/ tests/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  eep-tests:
    name: EEP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EEP + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/eep/requirements.txt
          pip install pytest

      - name: Run EEP unit tests
        run: |
          pytest \
            tests/unit/test_schemas.py::TestStoreCreate \
            tests/unit/test_schemas.py::TestZoneCreate \
            tests/unit/test_schemas.py::TestCameraCreate \
            tests/unit/test_schemas.py::TestCalibrationRequest \
            tests/unit/test_schemas.py::TestComputeHomography \
            -v

  docker-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Start infrastructure (postgres, redis, minio only)
        run: docker compose up -d --wait postgres redis minio

      - name: Health check postgres
        run: docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-retailvision}"

      - name: Health check redis
        run: docker compose exec -T redis redis-cli ping

      - name: Health check minio
        run: curl -fsS http://localhost:9000/minio/health/live

      - name: Tear down
        if: always()
        run: docker compose down -v

  observability-config:
    name: Observability Config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.4

      - name: Install promtool
        run: |
          PROM_VERSION="2.51.0"
          curl -sSL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
              prometheus-${PROM_VERSION}.linux-amd64/promtool
          promtool --version

      - name: Validate Prometheus rules and dashboards
        run: |
          promtool check rules monitoring/alert_rules.yml
          promtool check rules monitoring/recording_rules.yml
          for f in monitoring/grafana/provisioning/dashboards/*.json charts/retailvision/files/grafana/dashboards/*.json; do
            jq empty "$f"
          done

      - name: Render Kubernetes manifests
        run: |
          helm lint charts/retailvision -f charts/retailvision/values.production.yaml
          helm template retailvision charts/retailvision \
            -f charts/retailvision/values.production.yaml \
            --set global.imageRegistry=ghcr.io/example/retailvision \
            --set ingress.appHost=app.example.com \
            --set eep.grpcHost=eep.example.com \
            --set monitoring.grafana.host=grafana.example.com \
            --set mlflow.host=mlflow.example.com >/tmp/retailvision-rendered.yaml
          kubectl kustomize infra/edge/base >/tmp/retailvision-edge-base.yaml
          kubectl kustomize infra/edge/overlays/jetson >/tmp/retailvision-edge-jetson.yaml
