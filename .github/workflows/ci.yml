name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: flake8
        run: |
          flake8 services/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E124,E128,E261,E301,E302,E402,F401,F811,F821,F841

      - name: black (check only)
        continue-on-error: true
        run: black --check --line-length=120 services/ tests/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  eep-tests:
    name: EEP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EEP + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/eep/requirements.txt
          pip install pytest

      - name: Run EEP unit tests
        run: |
          pytest \
            tests/unit/test_schemas.py::TestStoreCreate \
            tests/unit/test_schemas.py::TestZoneCreate \
            tests/unit/test_schemas.py::TestCameraCreate \
            tests/unit/test_schemas.py::TestCalibrationRequest \
            tests/unit/test_schemas.py::TestComputeHomography \
            -v

  validate-prometheus:
    name: Prometheus Config Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          PROM_VERSION="2.51.0"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin prometheus-${PROM_VERSION}.linux-amd64/promtool
          promtool --version

      - name: Validate prometheus.yml (compose/dev)
        run: promtool check config monitoring/prometheus.yml

      - name: Validate prometheus-cloud.yml
        run: promtool check config monitoring/prometheus-cloud.yml

      - name: Validate prometheus-edge.yml
        run: promtool check config monitoring/prometheus-edge.yml

      - name: Validate alert_rules.yml
        run: promtool check rules monitoring/alert_rules.yml

      - name: Validate recording_rules.yml
        run: promtool check rules monitoring/recording_rules.yml

      - name: Install amtool
        run: |
          AM_VERSION="0.27.0"
          curl -sSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin alertmanager-${AM_VERSION}.linux-amd64/amtool
          amtool --version

      - name: Validate alertmanager.yml
        run: amtool check-config monitoring/alertmanager.yml

  docker-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Start infrastructure (postgres, redis, minio only)
        run: docker compose up -d --wait postgres redis minio

      - name: Health check postgres
        run: docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-retailvision}"

      - name: Health check redis
        run: docker compose exec -T redis redis-cli ping

      - name: Health check minio
        run: curl -fsS http://localhost:9000/minio/health/live

      - name: Tear down
        if: always()
        run: docker compose down -v
